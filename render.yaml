services:
  - type: web
    name: mock-dept-a
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn mock_dept_a.main:app --host 0.0.0.0 --port $PORT

  - type: web
    name: mock-dept-b
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn mock_dept_b.main:app --host 0.0.0.0 --port $PORT

  - type: web
    name: sih-gateway
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd gateway && uvicorn main:app --host 0.0.0.0 --port $PORT